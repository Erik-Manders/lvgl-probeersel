; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = 
	bodmer/TFT_eSPI@^2.3.0
	https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    https://github.com/lvgl/lvgl.git#v9.3.0
	; tomstewart89/BasicLinearAlgebra
	; https://github.com/adafruit/Adafruit_Si7021.git
	; https://github.com/adafruit/adafruit_sensor.git
	adafruit/Adafruit BusIO
	https://github.com/adafruit/Adafruit_VL6180X.git


build_flags =
    -D USER_SETUP_LOADED=1

    ; --- Driver ---
    -D ILI9341_2_DRIVER=1

    ; --- Schermafmetingen ---
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320

    ; --- Schemkleuren ---
    -D TFT_INVERSION_ON=1

    ; --- Display pinnen (SPI) ---
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH

    ; --- Touchscreen ---
    -D TOUCH_CS=33
    -D SPI_TOUCH_FREQUENCY=2500000

    ; --- SPI-poort en snelheid ---
    -D USE_HSPI_PORT=1
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000

    ; --- Fonts ---
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1

    -D LV_CONF_PATH='"lv_conf.h"'
